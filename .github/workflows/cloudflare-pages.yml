name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      PROJECT_NAME: fun-red-panda-games
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Cloudflare authentication
        run: |
          npx wrangler whoami

      - name: Check that docs folder exists
        run: |
          if [ ! -d docs ]; then
            echo "docs/ directory not found"
            exit 1
          fi

      - name: Ensure Cloudflare Pages project exists
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          project = os.environ["PROJECT_NAME"]
          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]

          try:
              out = subprocess.check_output(
                  [
                      "npx",
                      "wrangler",
                      "pages",
                      "project",
                      "list",
                      "--account-id",
                      account_id,
                      "--json",
                  ],
                  text=True,
                  stderr=subprocess.STDOUT,
              )
              projects = json.loads(out)
          except subprocess.CalledProcessError as error:
              print(error.output)
              raise

          names = [
              item.get("name")
              for item in projects
              if isinstance(item, dict)
          ]

          if project not in names:
              subprocess.run(
                  [
                      "npx",
                      "wrangler",
                      "pages",
                      "project",
                      "create",
                      project,
                      "--production-branch=main",
                      "--account-id",
                      account_id,
                  ],
                  check=True,
              )
          else:
              print(f"Project {project} already exists")
          PY

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy docs \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --account-id="$CLOUDFLARE_ACCOUNT_ID"
