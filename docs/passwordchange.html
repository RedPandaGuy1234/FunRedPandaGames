<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="FunRedPandaGames: the best website to play games on and have fun.">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --felt:#16302A;
    --felt-dark:#0E211B;
    --felt-light:#1E3E35;
    --cream:#F3EAD7;
    --cream-dim:#E4D8BF;
    --gold:#D4A72C;
    --error:#F2789A;
    --success:#7FD6A0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, var(--felt-light), var(--felt) 55%, var(--felt-dark) 100%);
    color:var(--cream);
    font-family:'Inter',Arial,sans-serif;
    min-height:100vh;
    padding:26px 16px 56px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .back-link{align-self:flex-start; color:var(--cream-dim); font-size:13px; text-decoration:none; margin-bottom:18px;}
  .back-link:hover{color:var(--gold);}
  h1{font-weight:700; font-size:clamp(26px,5vw,38px); margin:0 0 6px;}
  .sub{color:var(--cream-dim); font-size:13.5px; margin:0 0 26px; text-align:center; max-width:420px;}
  .panel{
    width:min(420px,92vw);
    background:rgba(0,0,0,.18);
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
    padding:24px 22px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  label{font-size:12.5px; color:var(--cream-dim); letter-spacing:.03em; text-transform:uppercase;}
  .field{display:flex; flex-direction:column; gap:6px;}
  input[type=password]{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.24);
    color:var(--cream);
    font-size:16px;
    padding:11px 13px;
    border-radius:9px;
    width:100%;
  }
  input:focus{outline:none; border-color:var(--gold);}
  .hint{font-size:11.5px; color:var(--cream-dim); opacity:.8;}
  .current{font-size:15px; text-align:center; line-height:1.5;}
  .current b{color:var(--gold);}
  button.action{
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    color:var(--felt-dark);
    background:linear-gradient(180deg,#E7C866,var(--gold));
    border:none;
    padding:12px 18px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 4px 0 #9a7620, 0 8px 16px rgba(0,0,0,.35);
  }
  button.action:active{transform:translateY(2px); box-shadow:0 1px 0 #9a7620, 0 4px 8px rgba(0,0,0,.3);}
  button.action:disabled{opacity:.5; cursor:default;}
  .login-link{
    display:inline-block; text-align:center; text-decoration:none;
    font-weight:700; font-size:15px; color:var(--felt-dark);
    background:linear-gradient(180deg,#E7C866,var(--gold));
    padding:12px 18px; border-radius:999px;
    box-shadow:0 4px 0 #9a7620, 0 8px 16px rgba(0,0,0,.35);
  }
  .status{font-size:14px; line-height:1.5; min-height:20px; text-align:center;}
  .status.error{color:var(--error);}
  .status.ok{color:var(--success);}
  .hidden{display:none !important;}
</style>
</head>
<body>

  <a class="back-link" href="account.html">← Back to account</a>
  <h1>Change Password</h1>
  <p class="sub">Enter your current password, then choose a new one. You will stay logged in on this device and be logged out everywhere else.</p>

  <div class="panel" id="loadingPanel">
    <div class="status" id="loadingText">Loading…</div>
  </div>

  <div class="panel hidden" id="loggedOutPanel">
    <div class="current">You need to be logged in to change your password.</div>
    <a class="login-link" href="account.html">Log in / Sign up</a>
  </div>

  <div class="panel hidden" id="formPanel">
    <div class="current">Logged in as <b id="currentName"></b></div>
    <form id="passwordForm" style="display:flex; flex-direction:column; gap:14px;">
      <div class="field">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" autocomplete="current-password" maxlength="128">
      </div>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" maxlength="128">
        <span class="hint">At least 8 characters.</span>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" maxlength="128">
      </div>
      <button class="action" id="submitBtn" type="submit">Change Password</button>
    </form>
    <div class="status" id="formStatus"></div>
  </div>

<script>
const loadingPanel = document.getElementById('loadingPanel');
const loadingText = document.getElementById('loadingText');
const loggedOutPanel = document.getElementById('loggedOutPanel');
const formPanel = document.getElementById('formPanel');
const currentName = document.getElementById('currentName');
const passwordForm = document.getElementById('passwordForm');
const currentPassword = document.getElementById('currentPassword');
const newPassword = document.getElementById('newPassword');
const confirmPassword = document.getElementById('confirmPassword');
const submitBtn = document.getElementById('submitBtn');
const formStatus = document.getElementById('formStatus');

function setStatus(text, kind){
  formStatus.textContent = text;
  formStatus.className = 'status' + (kind ? ' ' + kind : '');
}

function showForm(username){
  loadingPanel.classList.add('hidden');
  loggedOutPanel.classList.add('hidden');
  formPanel.classList.remove('hidden');
  currentName.textContent = username;
}

function showLoggedOut(){
  loadingPanel.classList.add('hidden');
  formPanel.classList.add('hidden');
  loggedOutPanel.classList.remove('hidden');
}

async function boot(){
  try {
    const response = await fetch('/api/me', { credentials: 'same-origin' });
    if(!response.ok) throw new Error('bad response');
    const data = await response.json();
    if(data.username){
      showForm(data.username);
    } else {
      showLoggedOut();
    }
  } catch (err) {
    loadingText.textContent = 'Could not reach the server. This page only works on the live site.';
  }
}

passwordForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const current = currentPassword.value;
  const next = newPassword.value;
  const confirm = confirmPassword.value;
  if(!current || !next){
    setStatus('Fill in your current and new password.', 'error');
    return;
  }
  if(next.length < 8){
    setStatus('Password must be at least 8 characters.', 'error');
    return;
  }
  if(next !== confirm){
    setStatus('The new passwords do not match.', 'error');
    return;
  }
  submitBtn.disabled = true;
  setStatus('Changing password…', '');
  try {
    const response = await fetch('/api/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ currentPassword: current, newPassword: next })
    });
    let data = {};
    try { data = await response.json(); } catch (err) { data = {}; }
    if(response.ok){
      currentPassword.value = '';
      newPassword.value = '';
      confirmPassword.value = '';
      setStatus('Password changed!', 'ok');
    } else if(response.status === 401){
      showLoggedOut();
    } else {
      setStatus(data.error || 'Could not change your password.', 'error');
    }
  } catch (err) {
    setStatus('Could not reach the server. This page only works on the live site.', 'error');
  }
  submitBtn.disabled = false;
});

boot();
</script>
</body>
</html>
