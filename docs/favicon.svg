<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- background -->
  <rect width="64" height="64" rx="14" fill="#0E211B"/>

  <!-- tail, sweeping behind and connecting underneath the body -->
  <path
    d="M17 53
       Q9 52 6 45
       Q3 38 8 30
       Q13 35 11 43
       Q10 46 8 48
       Q13 47 14 41
       Q16 36 12 30
       Q19 37 16 45
       Q15 49 17 53 Z"
    fill="#B5551F"
  />

  <path
    d="M15.5 51
       Q9 48 8 43
       Q7.5 40 9 38"
    stroke="#F3EAD7"
    stroke-width="2"
    fill="none"
    stroke-linecap="round"
  />

  <!-- body / torso -->
  <path
    d="M18 30 Q14 40 16 52 Q18 60 32 61
       Q46 60 48 52 Q50 40 46 30
       Q40 26 32 27 Q24 26 18 30 Z"
    fill="#C1440E"
  />

  <!-- belly patch -->
  <ellipse cx="32" cy="45" rx="9.5" ry="13" fill="#F3EAD7"/>

  <!-- feet -->
  <ellipse cx="24" cy="60" rx="4" ry="2.5" fill="#3A2318"/>
  <ellipse cx="40" cy="60" rx="4" ry="2.5" fill="#3A2318"/>

  <!-- arms reaching down to the controller -->
  <path
    d="M20 33 Q14 42 16 52 Q17 55 21 55 Q19 46 24 36 Z"
    fill="#8B4A2B"
  />

  <path
    d="M44 33 Q50 42 48 52 Q47 55 43 55 Q45 46 40 36 Z"
    fill="#8B4A2B"
  />

  <!-- paws -->
  <circle cx="17" cy="53" r="3" fill="#3A2318"/>
  <circle cx="47" cy="53" r="3" fill="#3A2318"/>

  <!-- head -->
  <circle cx="22" cy="9" r="5.5" fill="#8B4A2B"/>
  <circle cx="42" cy="9" r="5.5" fill="#8B4A2B"/>
  <circle cx="22" cy="9.5" r="2.6" fill="#3A2318"/>
  <circle cx="42" cy="9.5" r="2.6" fill="#3A2318"/>

  <ellipse cx="32" cy="18" rx="12" ry="11" fill="#C1440E"/>

  <!-- eye whites -->
  <ellipse cx="26" cy="19" rx="4.6" ry="5.4" fill="#F3EAD7"/>
  <ellipse cx="38" cy="19" rx="4.6" ry="5.4" fill="#F3EAD7"/>

  <!--
    Pupils looking DOWN toward the controller.
    Left pupil moves down-right.
    Right pupil moves down-left.
  -->
  <ellipse cx="27.3" cy="20.7" rx="3.1" ry="3.4" fill="#3A2318"/>
  <ellipse cx="36.7" cy="20.7" rx="3.1" ry="3.4" fill="#3A2318"/>

  <!-- eye highlights follow the downward gaze -->
  <circle cx="28.1" cy="19.9" r="1.3" fill="#F3EAD7"/>
  <circle cx="37.5" cy="19.9" r="1.3" fill="#F3EAD7"/>

  <circle cx="28.1" cy="19.9" r="0.65" fill="#0E211B"/>
  <circle cx="37.5" cy="19.9" r="0.65" fill="#0E211B"/>

  <!-- muzzle -->
  <ellipse cx="32" cy="23.5" rx="4.8" ry="3.5" fill="#F3EAD7"/>
  <circle cx="32" cy="22" r="1.2" fill="#1B2420"/>

  <path
    d="M32 23 Q32 24 30.3 24.4"
    stroke="#1B2420"
    stroke-width="0.8"
    fill="none"
    stroke-linecap="round"
  />

  <path
    d="M32 23 Q32 24 33.7 24.4"
    stroke="#1B2420"
    stroke-width="0.8"
    fill="none"
    stroke-linecap="round"
  />

  <!-- forehead highlight -->
  <path
    d="M27 11 Q32 8 37 11 Q32 13.5 27 11 Z"
    fill="#F3EAD7"
    opacity="0.85"
  />

  <!-- game controller, held in front of the belly -->
  <rect
    x="19"
    y="47"
    width="26"
    height="12"
    rx="5.5"
    fill="#D4A72C"
  />

  <rect
    x="19"
    y="47"
    width="26"
    height="12"
    rx="5.5"
    fill="none"
    stroke="#9a7620"
    stroke-width="1"
  />

  <!-- D-pad -->
  <rect
    x="23.5"
    y="51.5"
    width="6.5"
    height="2.4"
    rx="0.6"
    fill="#0E211B"
  />

  <rect
    x="26"
    y="49.3"
    width="2.4"
    height="6.4"
    rx="0.6"
    fill="#0E211B"
  />

  <!-- buttons -->
  <circle cx="38.5" cy="51" r="1.6" fill="#0E211B"/>
  <circle cx="41.5" cy="53.8" r="1.6" fill="#0E211B"/>
</svg>
